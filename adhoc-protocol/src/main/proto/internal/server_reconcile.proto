syntax = "proto3";

package adhoc.internal.v1;

import "internal/common.proto";

option java_package = "io.gitee.songchaolin.adhoc.internal.grpc.v1";
option java_multiple_files = true;

// server 间对账：检查 job 是否还在某 server 节点上运行
message CheckJobRunningRequest {
  string job_id = 1;
}

message CheckJobRunningResponse {
  bool running = 1;
}

// server 间 job 日志转发：非处理节点查 running job log 时，转发到 processing_server 节点读内存。
message ServerJobLogRequest {
  string job_id = 1;
  int64 offset = 2;
  int32 limit = 3;
}

message ServerJobLogResponse {
  repeated string lines = 1;
  bool has_more = 2;
  bool found = 3;  // 本节点是否有该 job 日志（false=不在本节点/已清理，调用方 fallback OSS）
  bool complete = 4;  // 日志是否已完整（终态）：转发方据本节点 registry 快照判断
}

service ServerReconcileService {
  rpc checkJobRunning(CheckJobRunningRequest) returns (CheckJobRunningResponse);
  rpc fetchJobLog(ServerJobLogRequest) returns (ServerJobLogResponse);
}
